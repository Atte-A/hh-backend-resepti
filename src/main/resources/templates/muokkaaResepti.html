<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Muokkaa reseptiä</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Muokkaa reseptiä</h1>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Kirjaudu ulos</button>
    </form>
</div>

<form th:action="@{/reseptit/muokkaa/{id}(id=${resepti.reseptiId})}" th:object="${resepti}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="mb-3">
        <label for="nimi" class="form-label">Nimi</label>
        <input type="text" class="form-control" id="nimi" th:field="*{nimi}" />
        <div th:if="${#fields.hasErrors('nimi')}" th:errors="*{nimi}" class="text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="kuvaus" class="form-label">Kuvaus</label>
        <input type="text" class="form-control" id="kuvaus" th:field="*{kuvaus}" />
        <div th:if="${#fields.hasErrors('kuvaus')}" th:errors="*{kuvaus}" class="text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="ohje" class="form-label">Ohje</label>
        <textarea class="form-control" id="ohje" th:field="*{ohje}" rows="5"></textarea>
        <div th:if="${#fields.hasErrors('ohje')}" th:errors="*{ohje}" class="text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="valmistusaika" class="form-label">Valmistusaika (min)</label>
        <input type="number" class="form-control" id="valmistusaika" th:field="*{valmistusaika}" />
        <div th:if="${#fields.hasErrors('valmistusaika')}" th:errors="*{valmistusaika}" class="text-danger"></div>
    </div>

    <div class="mb-3">
        <label for="annosmaara" class="form-label">Annosmäärä</label>
        <input type="number" class="form-control" id="annosmaara" th:field="*{annosmaara}" />
        <div th:if="${#fields.hasErrors('annosmaara')}" th:errors="*{annosmaara}" class="text-danger"></div>
    </div>

    <button type="submit" class="btn btn-primary">Tallenna</button>
    <a href="/reseptit" class="btn btn-secondary">Peruuta</a>
</form>

</body>
</html>
