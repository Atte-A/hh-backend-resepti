<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title th:text="${resepti.nimi}"></title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>

  <div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 th:text="${resepti.nimi}"></h1>

      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Kirjaudu ulos</button>
      </form>
    </div>

    <div class="mb-3 text-muted">
      <p th:if="${resepti.annosmaara != null}" th:text="|${resepti.annosmaara} annosta|"></p>
      <p th:if="${resepti.valmistusaika != null}">
        <span th:if="${resepti.valmistusaika <= 60}" th:text="|Valmistusaika ${resepti.valmistusaika} min|"></span>
        <span th:if="${resepti.valmistusaika > 60}"
          th:text="|Valmistusaika ${resepti.valmistusaika / 60}h ${resepti.valmistusaika % 60}min|"></span>
      </p>
    </div>

    <p class="lead" th:text="${resepti.kuvaus}"></p>

    <h2 class="mt-4">Ainekset</h2>
    <ul class="list-group mb-4">
      <li class="list-group-item" th:each="aines : ${resepti.ainekset}">
        <span th:text="${aines.maara % 1 == 0 ? aines.maara.intValue() : aines.maara}"></span>
        <span th:text="${aines.yksikko}"></span>
        <span th:text="${aines.ainesosa.nimi}"></span>
      </li>
    </ul>

    <h2>Ohje</h2>
    <ol class="list-group list-group-numbered mb-4">
      <li class="list-group-item" th:each="rivi : ${#strings.arraySplit(resepti.ohje, ';')}" th:text="${rivi}"></li>
    </ol>

    <div class="d-flex gap-3">
      <a href="/reseptit" class="btn btn-secondary">Takaisin</a>
      <a th:href="@{/reseptit/muokkaa/{id}(id=${resepti.reseptiId})}" class="btn btn-primary"
        sec:authorize="hasRole('ADMIN')">Muokkaa</a>
      <form th:action="@{/reseptit/poista/{id}(id=${resepti.reseptiId})}" method="post"
        sec:authorize="hasRole('ADMIN')">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Haluatko varmasti poistaa reseptin?');">
          Poista
        </button>
      </form>
    </div>

  </div>

</body>

</html>
