<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

  <h1 th:text="${resepti.nimi}"></h1>

  <p th:if="${resepti.annosmaara != null}" th:text="|${resepti.annosmaara} annosta|"></p>

  <p th:if="${resepti.valmistusaika != null}">
    <span th:if="${resepti.valmistusaika <= 60}" th:text="|${resepti.valmistusaika} min|">
    </span>
    <span th:if="${resepti.valmistusaika > 60}"
      th:text="|${resepti.valmistusaika / 60}h ${resepti.valmistusaika % 60}min|">
    </span>
  </p>
  <p th:text="${resepti.kuvaus}"></p>

  <h2>Ainekset</h2>

  <ul>
    <li th:each="aines : ${resepti.ainekset}">
      <span th:text="${aines.maara % 1 == 0 ? aines.maara.intValue() : aines.maara}"></span>
      <span th:text="${aines.yksikko}"></span>
      <span th:text="${aines.ainesosa.nimi}"></span>
    </li>
  </ul>

<h2>Ohje</h2>
<ol>
  <li th:each="rivi : ${#strings.arraySplit(resepti.ohje, ';')}"
      th:text="${rivi}">
  </li>
</ol>

  <a href="/reseptit">Takaisin</a>

</body>

</html>
