<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Tagit</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<div sec:authorize="hasRole('ADMIN')" class="m-4 d-flex gap-2">

  <a href="/reseptit" class="btn btn-primary">
    Reseptit
  </a>

  <a href="/ainesosat" class="btn btn-primary">
    Ainesosat
  </a>

  <a href="/tagit" class="btn btn-primary">
    Tagit
  </a>

</div>
<div th:if="${error}" class="alert alert-danger m-4">
  <span th:text="${error}"></span>
</div>

<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Tagit</h1>

      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Kirjaudu ulos</button>
      </form>
    </div>

    <div class="list-group">
      <div th:each="tag : ${tagit}" class="list-group-item d-flex justify-content-between align-items-center">
        <span th:text="${tag.nimi}"></span>
        <form th:action="@{/tagit/{id}(id=${tag.tagId})}" method="post" th:object="${tag}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-danger">Poista</button>
        </form>
      </div>
    </div>
    <div class="d-flex mt-4">
      <a th:href="@{/tagit/lisaa}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">Lisää uusi tagi</a>
    </div>
  </div>
</body>

</html>
