<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Lisää Ainesosa</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
  <div class="container mt-5">
    <h1>Lisää uusi ainesosa</h1>

    <form th:action="@{/ainesosat/lisaa}" th:object="${ainesosa}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="mb-3">
        <label class="form-label">Nimi</label>
        <input type="text" class="form-control" th:field="*{nimi}" />
        <div class="text-danger" th:if="${#fields.hasErrors('nimi')}" th:errors="*{nimi}"></div>
      </div>
      <div class="d-flex mt-4 gap-3">
        <button type="submit" class="btn btn-success">Lisää ainesosa</button>
        <a href="/ainesosat" class="btn btn-secondary">Peruuta</a>
      </div>
    </form>
  </div>
</body>

</html>
