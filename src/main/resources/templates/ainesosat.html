<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Ainesosat</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Ainesosat</h1>

      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Kirjaudu ulos</button>
      </form>
    </div>

    <div class="list-group">
      <div th:each="ainesosa : ${ainesosat}" class="list-group-item d-flex justify-content-between align-items-center">
        <span th:text="${ainesosa.nimi}"></span>
        <form th:action="@{/ainesosat/{id}(id=${ainesosa.ainesosaId})}" method="post" th:object="${ainesosa}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-danger">Poista</button>
        </form>
      </div>
    </div>
    <div class="d-flex mt-4">
      <a th:href="@{/ainesosat/lisaa}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">Lisää uusi ainesosa</a>
    </div>
  </div>
</body>

</html>
