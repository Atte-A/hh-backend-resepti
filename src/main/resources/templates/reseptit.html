<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Reseptit</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
  <div sec:authorize="hasRole('ADMIN')" class="m-4 d-flex gap-2">

  <a href="/reseptit" class="btn btn-primary">
    Reseptit
  </a>

  <a href="/ainesosat" class="btn btn-primary">
    Ainesosat
  </a>

   <a href="/tagit" class="btn btn-primary">
    Tagit
  </a>

</div>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Reseptit</h1>

      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Kirjaudu ulos</button>
      </form>
    </div>

    <div class="list-group">
      <a th:each="resepti : ${reseptit}" th:href="@{/reseptit/{id}(id=${resepti.reseptiId})}" th:text="${resepti.nimi}"
        class="list-group-item list-group-item-action">
      </a>

    </div>
    <div class="d-flex mt-4">
      <a th:href="@{/reseptit/lisaa}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">Lisää uusi resepti</a>
    </div>
  </div>
</body>

</html>
